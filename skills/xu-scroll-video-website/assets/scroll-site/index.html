<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinematic presentation</title><link rel="stylesheet" href="style.css"></head>
<body><main id="scenes"><p id="empty">This presentation has no scenes yet.</p></main>
<nav aria-label="Presentation controls"><button id="previous" aria-label="Previous scene">←</button><button id="play" aria-pressed="false">Play</button><span id="current" aria-live="polite"></span><progress id="progress" max="1" value="0" aria-label="Scene progress"></progress><button id="next" aria-label="Next scene">→</button><button id="motion" hidden>Enable motion</button></nav>
<script type="module" src="app.js"></script></body></html>
